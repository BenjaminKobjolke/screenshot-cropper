[project]
name = "screenshot-cropper"
version = "0.1.0"
description = "A tool to crop screenshots based on JSON configuration"
requires-python = ">=3.11"
dependencies = [
    "pillow>=11.0",
    "adobe-document-handler[all] @ git+https://github.com/BenjaminKobjolke/adobe-document-handler.git",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
    "mypy",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
